name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  extension-lint:
    name: Extension Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest.json
        run: python3 -c "import json; json.load(open('extension/manifest.json')); print('✓ manifest.json is valid JSON')"

      - name: Check for API keys in extension
        run: |
          echo "Scanning extension/ for leaked secrets..."
          if grep -rEi '(sk-ant-|sk-[a-zA-Z0-9]{20,}|api_key\s*=\s*["\x27][^"\x27]+)' extension/; then
            echo "❌ Potential API key found in extension code!"
            exit 1
          fi
          echo "✓ No API keys found in extension/"
