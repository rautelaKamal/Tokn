services:
  - type: web
    name: tokn-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: '["chrome-extension://*"]'
      - key: RATE_LIMIT
        value: 10/minute
      - key: PROMPT_CACHE_MAXSIZE
        value: "256"
      - key: PROMPT_CACHE_TTL_SECONDS
        value: "3600"
      - key: TIKTOKEN_ENCODING
        value: cl100k_base
      - key: INPUT_COST_PER_MILLION
        value: "0.0"
      - key: OUTPUT_COST_PER_MILLION
        value: "0.0"
      - key: GROQ_API_KEY
        sync: false  # must be set manually in dashboard
      - key: PYTHON_VERSION
        value: "3.11.0"

